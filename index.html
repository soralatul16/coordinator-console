<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics Coordinator Console</title>
<style>
  :root{
    --paper1:#fef5f0;
    --paper2:#eef4fb;
    --paper3:#eef9f2;
    --surface:#ffffff;
    --surface-2:#f6f8fc;
    --ink:#263447;
    --ink-soft:#5b687a;
    --ink-mute:#9aa4b4;
    --line:#eef1f7;
    --line-strong:#e1e6ef;
    --brand:#ef6b4d;       /* coral */
    --brand-2:#f6a35b;     /* apricot */
    --brand-grad:linear-gradient(135deg,#ff8d68,#f26c3f);
    --accent:#ef6b4d;
    --accent-soft:#ffe7dd;
    --good:#2f9e63;
    --good-soft:#e3f6ec;
    --warn:#c67d1a;
    --warn-soft:#fbeed6;
    --crit:#d8514f;
    --crit-soft:#fde2e2;
    --info:#3a7bb8;
    --info-soft:#e4f0fb;
    --sky-grad:linear-gradient(135deg,#ecf4ff,#d9ecff);
    --rose-grad:linear-gradient(135deg,#ffeef1,#ffdfe4);
    --peach-grad:linear-gradient(135deg,#fff2e8,#ffe3cf);
    --mint-grad:linear-gradient(135deg,#eafaf1,#d6f2e1);
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(38,52,71,.04), 0 10px 30px rgba(38,52,71,.06);
    --shadow-lift:0 4px 10px rgba(38,52,71,.08), 0 22px 50px rgba(38,52,71,.12);
    --font-display:'Iowan Old Style','Palatino Linotype','Palatino','Charter','Georgia',serif;
    --font-body:'Avenir Next','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font-body);
    background:linear-gradient(160deg,var(--paper1) 0%,var(--paper2) 52%,var(--paper3) 100%);
    background-attachment:fixed;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  ::selection{background:var(--accent-soft)}

  /* Layout */
  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
  .sidebar{
    background:linear-gradient(180deg,#ffffff 0%,#fff4ef 55%,#eef5fb 100%);
    color:var(--ink);
    border-right:1px solid var(--line);
    padding:22px 16px 70px;
    display:flex;flex-direction:column;gap:4px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
  .brand .mark{
    font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1;letter-spacing:.3px;
    background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .sub{font-size:11px;color:var(--ink-mute);letter-spacing:.14em;text-transform:uppercase}
  .nav-group-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mute);padding:16px 10px 6px}
  .nav-btn{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--ink-soft);padding:9px 11px;border-radius:10px;
    font-size:14px;font-weight:500;transition:background .15s,color .15s;
  }
  .nav-btn .ic{width:17px;height:17px;flex:none;opacity:.7}
  .nav-btn:hover{background:rgba(239,107,77,.09);color:var(--brand)}
  .nav-btn.active{background:var(--brand-grad);color:#fff;box-shadow:0 7px 18px rgba(239,107,77,.3)}
  .nav-btn.active .ic{opacity:1}
  .nav-badge{margin-left:auto;background:var(--surface-2);color:var(--ink-soft);font-size:11px;font-weight:700;
    padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
  .nav-btn.active .nav-badge{background:rgba(255,255,255,.3);color:#fff}
  .nav-badge.alert{background:var(--crit);color:#fff}
  .nav-btn.active .nav-badge.alert{background:rgba(255,255,255,.32);color:#fff}

  .main{padding:26px 32px 90px;max-width:1180px;margin:0 auto;width:100%}
  .topline{display:flex;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap}
  .page-title{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:.2px;margin:0}
  .page-sub{color:var(--ink-soft);font-size:14px;margin:2px 0 22px}
  .spacer{flex:1}
  .search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-mute)}
  .search{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line-strong);border-radius:10px;
    background:var(--surface);font-size:13.5px;color:var(--ink);outline:none}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
    padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--brand-grad);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(239,107,77,.26)}
  .btn.primary:hover{filter:brightness(1.05);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.icon{padding:7px 8px}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .section{margin-bottom:26px}
  .section-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
  .section-head h2{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0}
  .section-head .count{color:var(--ink-mute);font-size:13px;font-weight:600}

  /* Stat tiles */
  .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}
  .tile{padding:17px 17px 16px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.65);background:var(--surface);
    cursor:pointer;transition:.18s;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .tile:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
  .tile .tnum{font-family:var(--font-display);font-size:36px;font-weight:600;line-height:1}
  .tile .tlbl{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-weight:600;letter-spacing:.02em}
  .tile .bar{display:none}
  .tile.t-today{background:var(--sky-grad)} .tile.t-today .tnum{color:var(--info)}
  .tile.t-over{background:var(--rose-grad)} .tile.t-over .tnum{color:var(--crit)}
  .tile.t-week{background:var(--peach-grad)} .tile.t-week .tnum{color:#d9682f}
  .tile.t-up{background:var(--mint-grad)} .tile.t-up .tnum{color:var(--good)}

  /* Capture */
  .capture{background:linear-gradient(135deg,#fff3ec 0%,#eef4fb 100%);border:1px solid rgba(255,255,255,.75);
    border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);margin-bottom:24px}
  .capture h3{margin:0 0 3px;font-family:var(--font-display);font-size:18px;font-weight:600}
  .capture p.hint{margin:0 0 12px;color:var(--ink-soft);font-size:13px}
  .cap-input{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;
    padding:12px 13px;font-size:15px;color:var(--ink);background:#fff;outline:none;line-height:1.5}
  .cap-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .cap-row{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap}
  .cap-hint2{color:var(--ink-mute);font-size:12px;flex:1;min-width:160px}
  .chip-preview{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:20px;padding:3px 10px;font-size:12px;color:var(--ink-soft);font-weight:600}
  .chip b{color:var(--ink);font-weight:700}

  /* List rows */
  .rows{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--surface-2)}
  .check{width:19px;height:19px;border:2px solid var(--line-strong);border-radius:6px;flex:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:#fff;transition:.15s}
  .check:hover{border-color:var(--good)}
  .check.done{background:var(--good);border-color:var(--good)}
  .check.done svg{color:#fff;width:12px;height:12px}
  .row-main{flex:1;min-width:0}
  .row-title{font-size:14.5px;font-weight:600;color:var(--ink);margin:0}
  .row.done .row-title{text-decoration:line-through;color:var(--ink-mute)}
  .row-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
  .tag.type{background:var(--accent-soft);color:#8a5214}
  .tag.grade{background:var(--info-soft);color:var(--info)}
  .tag.teach{background:#ece7f3;color:#5a4a86}
  .tag.subj{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
  .due{font-size:12.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:5px}
  .due.over{color:var(--crit)} .due.today{color:var(--warn)} .due.soon{color:var(--accent)} .due.far{color:var(--ink-soft)} .due.none{color:var(--ink-mute);font-weight:500}
  .prio{width:7px;height:7px;border-radius:50%;flex:none}
  .prio.high{background:var(--crit)} .prio.normal{background:transparent}
  .row-del{opacity:0;color:var(--ink-mute);border:0;background:none;padding:4px;border-radius:6px;transition:.12s}
  .row:hover .row-del{opacity:1}
  .row-del:hover{color:var(--crit);background:var(--crit-soft)}

  /* Status pills (corrections) */
  .pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .pill.ontime{background:var(--good-soft);color:var(--good)}
  .pill.late{background:var(--crit-soft);color:var(--crit)}
  .pill.pending{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line)}
  .pill.overdue{background:var(--warn-soft);color:var(--warn)}
  .dot{width:6px;height:6px;border-radius:50%}
  .dot.good{background:var(--good)} .dot.late{background:var(--crit)} .dot.warn{background:var(--warn)} .dot.mute{background:var(--ink-mute)}

  /* Table */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);
    font-weight:700;padding:11px 13px;border-bottom:1px solid var(--line-strong);background:var(--surface-2)}
  .tbl td{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  .tbl tr:last-child td{border-bottom:0}
  .tbl tr:hover td{background:var(--surface-2)}
  .tbl .nm{font-weight:600}
  .mini{font-size:12px;color:var(--ink-mute)}

  .tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px;border:1px solid var(--line);width:fit-content;margin-bottom:16px}
  .tab{border:0;background:transparent;padding:7px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
  .tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .filt{border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .filt.active{background:var(--brand);border-color:var(--brand);color:#fff}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-mute)}
  .empty .big{font-family:var(--font-display);font-size:17px;color:var(--ink-soft);margin-bottom:4px}

  .alert-strip{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:13.5px;font-weight:600}
  .alert-strip.crit{background:var(--crit-soft);color:var(--crit)}
  .alert-strip.warn{background:var(--warn-soft);color:var(--warn)}
  .alert-strip.ok{background:var(--good-soft);color:var(--good)}
  .alert-strip .ac{flex:1}
  .alert-strip .go{font-size:12px;text-decoration:underline;cursor:pointer}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:40;transform:translateX(-100%);transition:transform .2s;width:244px}
    .sidebar.open{transform:none}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-2{grid-template-columns:1fr}
    .main{padding:18px 16px 90px}
    .menu-toggle{display:inline-flex!important}
    .scrim.show{display:block}
  }
  .menu-toggle{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(20,27,42,.4);z-index:35}

  /* progress meter */
  .meter{height:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex}
  .meter i{display:block;height:100%}
  .meter i.g{background:var(--good)} .meter i.r{background:var(--crit)} .meter i.m{background:var(--line-strong)}
  .legend{display:flex;gap:14px;margin-top:9px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);font-weight:600}

  /* Modal */
  .modal-scrim{position:fixed;inset:0;background:rgba(20,27,42,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal-scrim.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;width:100%;max-width:520px;box-shadow:var(--shadow-lift);max-height:88vh;overflow:auto}
  .modal-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:between}
  .modal-head h3{font-family:var(--font-display);font-size:19px;margin:0;flex:1}
  .modal-body{padding:14px 20px 20px;display:flex;flex-direction:column;gap:13px}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.02em}
  .fld input,.fld select,.fld textarea{border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;font-size:14px;background:#fff;color:var(--ink);outline:none}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .modal-foot{padding:0 20px 20px;display:flex;gap:9px;justify-content:flex-end}
  .x{border:0;background:none;color:var(--ink-mute);font-size:22px;line-height:1;padding:0 4px}

  .toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brand);color:#fff;
    padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);opacity:0;transition:.25s;z-index:80;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--surface-2)}
  .filepick{display:none}
  .doc-icon{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:#8a5214;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}

  @media print{
    .sidebar,.topline .btn,.menu-toggle,.capture,.row-del,.filters,.scrim,.toast{display:none!important}
    .app{grid-template-columns:1fr}
    body{background:#fff}
    .card{box-shadow:none;border-color:#ccc}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="mark">Φ</span>
      <div>
        <div style="font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--ink);line-height:1.05">Atul Soral</div>
        <div class="sub" style="margin-top:2px">Physicism</div>
      </div>
    </div>
    <div class="nav-group-label">Overview</div>
    <button class="nav-btn" data-view="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</button>
    <button class="nav-btn" data-view="capture"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Quick Capture</button>
    <div class="nav-group-label">Workstreams</div>
    <button class="nav-btn" data-view="tasks"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks & Deadlines<span class="nav-badge" id="nb-tasks">0</span></button>
    <button class="nav-btn" data-view="corrections"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Exam Corrections<span class="nav-badge" id="nb-corr">0</span></button>
    <button class="nav-btn" data-view="ia"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6l-5 9a2 2 0 0 0 1.8 3h12.4a2 2 0 0 0 1.8-3l-5-9V2"/><path d="M8 2h8M7 15h10"/></svg>IA Lab<span class="nav-badge" id="nb-ia">0</span></button>
    <button class="nav-btn" data-view="documents"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Documents</button>
    <div class="spacer"></div>
    <div class="nav-group-label">Data</div>
    <button class="nav-btn" data-act="export"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Backup / Export</button>
    <button class="nav-btn" data-act="import"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>Restore / Import</button>
    <button class="nav-btn" data-act="sample"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>Load sample data</button>
    <button class="nav-btn" data-act="clear"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>Clear all data</button>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topline">
      <button class="menu-toggle" id="menuToggle"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="search" id="globalSearch" placeholder="Search tasks, corrections, documents…" autocomplete="off">
      </div>
      <div class="spacer"></div>
      <button class="btn primary" id="newBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>New</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<input type="file" id="filePick" class="filepick" multiple>
<div class="modal-scrim" id="modalScrim"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================ State ============================ */
const KEY='pcc_v3';
const DEFAULT_TEACHERS=['Atul Soral','Teacher 2','Teacher 3','Teacher 4'];
let state=load();
if(!state.ias)state.ias=[];
if(!state.settings)state.settings={teachers:[...DEFAULT_TEACHERS]};
function load(){

/* ============================ Helpers ============================ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayISO=()=>{const d=new Date();return d.toISOString().slice(0,10)};
function dOnly(iso){return iso?new Date(iso+'T00:00:00'):null;}
function daysBetween(aIso,bIso){ // b - a in days (date only)
  const a=dOnly(aIso),b=dOnly(bIso);if(!a||!b)return null;
  return Math.round((b-a)/86400000);
}
function fmtDate(iso){
  if(!iso)return '';
  const d=dOnly(iso);const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${m[d.getMonth()]}`;
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ============================ Natural-language classifier ============================ */
const MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11,
  january:0,february:1,march:2,april:3,june:5,july:6,august:7,september:8,october:9,november:10,december:11};

function parseDate(text){
  const t=text.toLowerCase();const now=new Date();const y=now.getFullYear();
  // relative
  if(/\btoday\b/.test(t))return todayISO();
  if(/\btomorrow\b|\btmrw\b/.test(t)){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10);}
  let m;
  if(m=t.match(/\bin (\d{1,3}) days?\b/)){const d=new Date();d.setDate(d.getDate()+(+m[1]));return d.toISOString().slice(0,10);}
  if(/\bnext week\b/.test(t)){const d=new Date();d.setDate(d.getDate()+7);return d.toISOString().slice(0,10);}
  if(/\bend of (the )?week\b/.test(t)){const d=new Date();const add=(5-d.getDay()+7)%7||5;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10);}
  // day names
  const days={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
  for(const k in days){if(new RegExp('\\b'+k+'\\b').test(t)){const d=new Date();const add=(days[k]-d.getDay()+7)%7||7;d.setDate(d.getDate()+add);return d.toISOString().slice(0,10);}}
  // iso 2026-10-15
  if(m=t.match(/\b(20\d{2})[-/](\d{1,2})[-/](\d{1,2})\b/))return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  // dd/mm or dd/mm/yyyy or dd-mm
  if(m=t.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/)){
    let yr=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):y;
    return `${yr}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  }
  // 15 October / 15th oct / october 15
  if(m=t.match(/\b(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]{3,9})\b/)){
    if(MONTHS[m[2]]!=null){let mon=MONTHS[m[2]];let date=new Date(y,mon,+m[1]);if(date<new Date(now.toDateString()))date=new Date(y+1,mon,+m[1]);return date.toISOString().slice(0,10);}
  }
  if(m=t.match(/\b([a-z]{3,9})\s+(\d{1,2})(?:st|nd|rd|th)?\b/)){
    if(MONTHS[m[1]]!=null){let mon=MONTHS[m[1]];let date=new Date(y,mon,+m[2]);if(date<new Date(now.toDateString()))date=new Date(y+1,mon,+m[2]);return date.toISOString().slice(0,10);}
  }
  return null;
}

function classify(text){
  const t=' '+text.toLowerCase()+' ';
  // grade / programme
  let grade='';
  if(/\bdp\s?1\b|\bdp-1\b|\bgrade 11\b|\byear 12\b|\bg11\b/.test(t))grade='DP1';
  else if(/\bdp\s?2\b|\bdp-2\b|\bgrade 12\b|\byear 13\b|\bg12\b/.test(t))grade='DP2';
  else if(/\bgrade 10\b|\bg10\b|\byear 11\b/.test(t))grade='Grade 10';
  else if(/\bgrade 9\b|\bg9\b|\byear 10\b/.test(t))grade='Grade 9';
  else if(/\bmyp\b/.test(t))grade='MYP';
  else if(/\bigcse\b|\bicgse\b/.test(t))grade='IGCSE';
  else if(/\bdp\b/.test(t))grade='DP';
  // type
  const typeMap=[
    ['Moderation',/\bmoderat/],['Standardisation',/\bstandardi[sz]/],['Markscheme',/\bmark ?scheme|\bms\b/],
    ['Question Paper',/\bquestion paper|\bqp\b|\bpaper\b/],['Correction',/\bcorrect|\bmarking\b|\bcopies\b|\bscript/],
    ['IA',/\binternal assessment\b|\bia\b/],['EE',/\bextended essay\b|\bee\b/],
    ['Observation',/\bobservation|\blearning walk\b/],['Meeting',/\bmeeting\b|\bmom\b|\bminutes\b/],
    ['Predicted Grade',/\bpredicted grade|\bpg\b/],['Intervention',/\bintervention|\bextra class|\bremedial\b/],
    ['Assessment',/\bassessment|\btest\b|\bexam\b|\bquiz\b/],['Report',/\breport\b/],
    ['Lesson Plan',/\blesson plan/],['Unit Plan',/\bunit plan|\bunit planner/],['Syllabus',/\bsyllabus|\bcurriculum/],
  ];
  let type='Task';
  for(const [name,re] of typeMap){if(re.test(t)){type=name;break;}}
  // teacher
  let teacher='';
  for(const tn of state.settings.teachers){if(t.includes(' '+tn.toLowerCase()+' ')||t.includes(' '+tn.toLowerCase()+'\'')){teacher=tn;break;}}
  const tm=text.match(/\bteacher\s+([A-Z][a-zA-Z]+)\b/);if(!teacher&&tm)teacher=tm[0].replace(/teacher/i,'Teacher');
  // priority
  const priority=/\burgent|\basap|\bhigh priority|\bimportant|\bcritical|!!/.test(t)?'high':'normal';
  const due=parseDate(text);
  return {grade,type,teacher,priority,due,subject:'Physics'};
}

/* ============================ Capture ============================ */
let capPreview=null;
function doCapture(text){
  text=(text||'').trim();if(!text)return;
  const c=classify(text);
  if(c.type==='Correction'){
    const corr={id:uid(),scope:'mine',title:text.replace(/\bby\b.*$/i,'').trim()||'Correction',grade:c.grade,teacher:'',
      copies:'',received:todayISO(),due:c.due,submitted:null,status:'pending',createdAt:Date.now()};
    state.corrections.push(corr);save();toast('Added to Exam Corrections');go('corrections');
    return;
  }
  const task={id:uid(),title:cleanTitle(text,c),raw:text,type:c.type,grade:c.grade,subject:c.subject,
    teacher:c.teacher,due:c.due,priority:c.priority,status:'open',recurring:null,notes:'',createdAt:Date.now()};
  state.tasks.push(task);save();
  toast(`Filed under ${c.type}${c.grade?' · '+c.grade:''}${c.due?' · due '+fmtDate(c.due):''}`);
  go('tasks');
}
function cleanTitle(text,c){
  let s=text.trim();
  // Capitalize first letter, trim trailing "by <date>" noise kept for context
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* ============================ Document auto-tagging ============================ */
function classifyFile(name){
  const n=name.toLowerCase();
  const c=classify(name.replace(/[_\-.]/g,' '));
  let docType=c.type;
  if(/outline/.test(n))docType='Course Outline';
  if(/planner|plan/.test(n)&&docType==='Task')docType='Planner';
  return {grade:c.grade,subject:'Physics',docType:docType==='Task'?'Document':docType};
}
function addFiles(files){
  let count=0;
  [...files].forEach(f=>{
    const meta=classifyFile(f.name);
    const doc={id:uid(),name:f.name,size:f.size,ftype:f.type,grade:meta.grade,subject:meta.subject,
      docType:meta.docType,link:'',thumb:null,createdAt:Date.now()};
    if(f.type.startsWith('image/')&&f.size<1600000){
      const r=new FileReader();r.onload=e=>{doc.thumb=e.target.result;save();if(view==='documents')render();};r.readAsDataURL(f);
    }
    state.docs.push(doc);count++;
  });
  save();toast(count+' file'+(count>1?'s':'')+' filed & tagged');if(view==='documents')render();
}

/* ============================ Derived ============================ */
function dueClass(iso){
  if(!iso)return 'none';
  const diff=daysBetween(todayISO(),iso);
  if(diff<0)return 'over';if(diff===0)return 'today';if(diff<=7)return 'soon';return 'far';
}
function dueLabel(iso){
  if(!iso)return 'No date';
  const diff=daysBetween(todayISO(),iso);
  if(diff<0)return `${fmtDate(iso)} · ${-diff}d overdue`;
  if(diff===0)return 'Today';if(diff===1)return 'Tomorrow';
  return `${fmtDate(iso)} · ${diff}d`;
}
const openTasks=()=>state.tasks.filter(t=>t.status!=='done');
function counts(){
  const o=openTasks();const td=todayISO();
  return {
    today:o.filter(t=>t.due===td).length,
    over:o.filter(t=>t.due&&daysBetween(td,t.due)<0).length,
    week:o.filter(t=>t.due&&daysBetween(td,t.due)>=0&&daysBetween(td,t.due)<=7).length,
    up:o.filter(t=>!t.due||daysBetween(td,t.due)>7).length,
  };
}
function corrState(c){
  if(c.submitted){const d=daysBetween(c.due,c.submitted);
    if(d===null)return {k:'ontime',label:'Done',dot:'good'};
    return d<=0?{k:'ontime',label:'On time',dot:'good'}:{k:'late',label:`Late · ${d}d`,dot:'late'};}
  if(c.due){const d=daysBetween(todayISO(),c.due);
    if(d<0)return {k:'overdue',label:`Overdue · ${-d}d`,dot:'warn'};
    if(d===0)return {k:'pending',label:'Due today',dot:'warn'};
    return {k:'pending',label:`Pending · ${d}d`,dot:'mute'};}
  return {k:'pending',label:'Pending',dot:'mute'};
}

function renderDash(){
  const c=counts();const td=todayISO();
  const todays=openTasks().filter(t=>t.due===td).sort(byDue);
  const over=openTasks().filter(t=>t.due&&daysBetween(td,t.due)<0).sort(byDue);
  const soon=openTasks().filter(t=>t.due&&daysBetween(td,t.due)>=1&&daysBetween(td,t.due)<=7).sort(byDue);
  const corrPend=state.corrections.filter(x=>!x.submitted);
  const corrOver=corrPend.filter(x=>x.due&&daysBetween(td,x.due)<0);
  let alerts='';
  if(over.length)alerts+=`<div class="alert-strip crit"><div class="ac">${over.length} overdue task${over.length>1?'s':''} need attention</div><span class="go" data-go="tasks" data-filt="overdue">View</span></div>`;
  if(corrOver.length)alerts+=`<div class="alert-strip warn"><div class="ac">${corrOver.length} exam correction${corrOver.length>1?'s':''} overdue (set dates passed)</div><span class="go" data-go="corrections">View</span></div>`;
  if(!over.length&&!corrOver.length&&(todays.length||c.week))alerts+=`<div class="alert-strip ok"><div class="ac">Nothing overdue — you're on track. ${todays.length} due today.</div></div>`;

  return `
  ${greeting()}
  ${captureBox()}
  <div class="tiles">
    ${tile('today',c.today,'Due today')}
    ${tile('over',c.over,'Overdue')}
    ${tile('week',c.week,'Due this week')}
    ${tile('up',c.up,'Upcoming / undated')}
  </div>
  ${dashCharts()}
  ${alerts}
  <div class="grid-2" style="margin-top:4px">
    <div class="section">
      <div class="section-head"><h2>Today & overdue</h2><span class="count">${todays.length+over.length}</span></div>
      <div class="card rows">${[...over,...todays].slice(0,8).map(taskRow).join('')||emptyMini('Nothing due right now')}</div>
    </div>
    <div class="section">
      <div class="section-head"><h2>Coming this week</h2><span class="count">${soon.length}</span></div>
      <div class="card rows">${soon.slice(0,8).map(taskRow).join('')||emptyMini('No deadlines in the next 7 days')}</div>
    </div>
  </div>

  `;
}
function greeting(){
  const h=new Date().getHours();const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const d=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  return `<div class="topline" style="margin-bottom:16px"><div><h1 class="page-title">${g}, Atul</h1><p class="page-sub" style="margin:0">${d} · Physics Department</p></div></div>`;
}
function dashCorr(pend){
  const all=state.corrections;if(!all.length)return '';
  const done=all.filter(c=>c.submitted);const onTime=done.filter(c=>daysBetween(c.due,c.submitted)<=0).length;
  const late=done.length-onTime;const p=pend.length;const total=all.length;
  const g=total?onTime/total*100:0,r=total?late/total*100:0,m=total?p/total*100:0;
  return `<div class="section"><div class="section-head"><h2>Exam correction health</h2><span class="count">${total} tracked</span></div>
  <div class="card" style="padding:17px 18px">
    <div class="meter"><i class="g" style="width:${g}%"></i><i class="r" style="width:${r}%"></i><i class="m" style="width:${m}%"></i></div>
    <div class="legend"><span><span class="dot good"></span>On time · ${onTime}</span><span><span class="dot late"></span>Late · ${late}</span><span><span class="dot mute"></span>Pending · ${p}</span></div>
  </div></div>`;
}
function tile(k,n,lbl){return `<div class="tile t-${k}" data-tile="${k}"><span class="bar"></span><div class="tnum">${n}</div><div class="tlbl">${lbl}</div></div>`;}

/* ---- Dashboard charts ---- */
function dueItems14(){
  const td=todayISO();const arr=Array.from({length:14},()=>0);
  const add=due=>{if(!due)return;const d=daysBetween(td,due);if(d>=0&&d<14)arr[d]++;};
  state.tasks.filter(t=>t.status!=='done').forEach(t=>add(t.due));
  state.corrections.filter(c=>!c.submitted).forEach(c=>add(c.due));
  state.ias.filter(i=>i.stage!=='Verified').forEach(i=>add(i.due));
  return arr;
}
function barChart14(){
  const arr=dueItems14();const max=Math.max(1,...arr);const base=new Date();
  const W=680,H=160,pad=22,bw=(W-pad*2)/14;
  const bars=arr.map((v,idx)=>{
    const h=v?Math.max(5,(v/max)*(H-46)):0;const x=pad+idx*bw+bw*0.17;const bwi=bw*0.66;const y=H-26-h;
    const d=new Date(base);d.setDate(d.getDate()+idx);const iso=d.toISOString().slice(0,10);
    const show=idx===0||d.getDate()%2===1;const col=idx===0?'var(--crit)':'url(#bgrad)';
    return `<g><rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwi.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}"><title>${v} due · ${fmtDate(iso)}</title></rect>${v?`<text x="${(x+bwi/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink-soft)">${v}</text>`:''}${show?`<text x="${(x+bwi/2).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--ink-mute)">${d.getDate()}</text>`:''}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Deadline load over the next 14 days">
    <defs><linearGradient id="bgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9c76"/><stop offset="1" stop-color="#ef6f3e"/></linearGradient></defs>
    <line x1="${pad}" y1="${H-26}" x2="${W-pad}" y2="${H-26}" stroke="var(--line-strong)" stroke-width="1"/>${bars}</svg>`;
}
function classBreakdown(){
  const map={};const bump=g=>{g=g||'Unfiled';map[g]=(map[g]||0)+1;};
  state.tasks.filter(t=>t.status!=='done').forEach(t=>bump(t.grade));
  state.corrections.filter(c=>!c.submitted).forEach(c=>bump(c.grade));
  state.ias.filter(i=>i.stage!=='Verified').forEach(i=>bump(i.grade));
  const entries=Object.entries(map).sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...entries.map(e=>e[1]));
  const col={'Grade 9':'#3a7bb8','Grade 10':'#2f9e63','IGCSE':'#d9682f','DP1':'#7b6ad0','DP2':'#c0518e','MYP':'#c67d1a','Unfiled':'#9aa4b4'};
  return entries.map(([g,n])=>`<div style="display:flex;align-items:center;gap:11px;margin-bottom:10px">
    <div style="width:64px;font-size:12.5px;font-weight:600;color:var(--ink-soft)">${esc(g)}</div>
    <div style="flex:1;min-width:0;background:var(--surface-2);border-radius:20px;height:12px;overflow:hidden"><i style="display:block;height:100%;width:${(n/max*100).toFixed(0)}%;background:${col[g]||'var(--brand)'};border-radius:20px"></i></div>
    <div style="width:20px;text-align:right;font-weight:700;font-size:13px">${n}</div></div>`).join('')||emptyMini('No open items');
}
function dashCharts(){

      <div class="section-head" style="margin-bottom:4px"><h2 style="font-size:16px">Deadline load · next 14 days</h2></div>

function byDue(a,b){if(!a.due)return 1;if(!b.due)return -1;return a.due<b.due?-1:1;}

    <span class="prio ${t.priority}"></span>
    <div class="row-main">

function renderTasks(){

  if(f==='today')list=list.filter(t=>t.status!=='done'&&t.due===td);

  else if(f==='week')list=list.filter(t=>t.status!=='done'&&t.due&&daysBetween(td,t.due)>=0&&daysBetween(td,t.due)<=7);
  else if(f==='upcoming')list=list.filter(t=>t.status!=='done'&&(!t.due||daysBetween(td,t.due)>7));

const IA_STAGES=['Proposal','Data Collection','Draft','Feedback','Final','Verified'];

function iaState(i){
  if(i.stage==='Verified')return {k:'ontime',label:'Verified',dot:'good'};
  if(i.due){const d=daysBetween(todayISO(),i.due);
    if(d<0)return {k:'overdue',label:`Behind · ${-d}d`,dot:'warn'};
    if(d===0)return {k:'pending',label:'Due today',dot:'warn'};
    return {k:'pending',label:`${d}d left`,dot:'mute'};}
  return {k:'pending',label:'No date',dot:'mute'};
}
function renderIA(){
  const groups={};

      <div class="fld-row">
        <div class="fld"><label>Priority</label><select id="m_prio">${opt('normal',t.priority)}${opt('high',t.priority)}</select></div>
        <div class="fld"><label>Repeat</label><select id="m_rec"><option value="">None</option><option value="weekly" ${t.recurring==='weekly'?'selected':''}>Weekly</option><option value="monthly" ${t.recurring==='monthly'?'selected':''}>Monthly</option></select></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="m_save">${edit?'Save':'Add task'}</button></div>
  `);
  $('#m_save').onclick=()=>{
    const title=$('#m_title').value.trim();if(!title){toast('Give it a title');return;}
    const data={title,type:$('#m_type').value,grade:$('#m_grade').value,due:$('#m_due').value||null,
      teacher:$('#m_teacher').value.trim(),priority:$('#m_prio').value,recurring:$('#m_rec').value||null,subject:'Physics'};
    if(edit){Object.assign(t,data);}else{state.tasks.push({id:uid(),status:'open',notes:'',createdAt:Date.now(),...data});}
    save();closeModal();render();toast(edit?'Saved':'Task added');
  };
}

function corrModal(scope,c){
  const edit=!!c;c=c||{grade:''};
  const grades=['','Grade 9','Grade 10','DP1','DP2','MYP','IGCSE'];
  const teachOpts=['',...state.settings.teachers];
  modal(`
    <div class="modal-head"><h3>${edit?'Edit':scope==='mine'?'New correction batch':'New teacher deadline'}</h3><button class="x" data-close>×</button></div>
    <div class="modal-body">
      <div class="fld"><label>${scope==='mine'?'Exam / batch name':'Exam / class'}</label><input id="c_title" value="${esc(c.title||'')}" placeholder="${scope==='mine'?'e.g. Grade 10 Unit Test — Fields':'e.g. DP1 Mock Paper 1'}"></div>
      ${scope==='team'?`<div class="fld"><label>Teacher</label><input id="c_teacher" list="teachlist" value="${esc(c.teacher||'')}" placeholder="Who is correcting"><datalist id="teachlist">${teachOpts.map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>`:''}
      <div class="fld-row">
        <div class="fld"><label>Grade</label><select id="c_grade">${grades.map(v=>`<option value="${v}" ${v===(c.grade||'')?'selected':''}>${v||'—'}</option>`).join('')}</select></div>
        <div class="fld"><label>${scope==='mine'?'No. of copies':'No. of scripts'}</label><input id="c_copies" value="${esc(c.copies||'')}" placeholder="e.g. 28"></div>
      </div>
      <div class="fld-row">
        <div class="fld"><label>${scope==='mine'?'Received on':'Date given'}</label><input type="date" id="c_recv" value="${c.received||todayISO()}"></div>
        <div class="fld"><label>Due by</label><input type="date" id="c_due" value="${c.due||''}"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="c_save">${edit?'Save':'Add'}</button></div>
  `);
  $('#c_save').onclick=()=>{
    const title=$('#c_title').value.trim();if(!title){toast('Give it a name');return;}
    const data={scope,title,grade:$('#c_grade').value,copies:$('#c_copies').value.trim(),
      received:$('#c_recv').value||todayISO(),due:$('#c_due').value||null,
      teacher:scope==='team'?($('#c_teacher')?.value.trim()||''):''};
    if(edit)Object.assign(c,data);else state.corrections.push({id:uid(),submitted:null,status:'pending',createdAt:Date.now(),...data});
    save();closeModal();render();toast('Saved');
  };
}

/* ============================ Bind ============================ */
function bind(){
  // capture
  const ci=$('#capInput');
  if(ci){
    const prev=()=>{const v=ci.value.trim();const p=$('#capPreview');if(!v){p.innerHTML='';return;}
      const c=classify(v);const chips=[];
      chips.push(`<span class="chip">→ <b>${c.type==='Correction'?'Exam Corrections':c.type}</b></span>`);
      if(c.grade)chips.push(`<span class="chip">Grade <b>${c.grade}</b></span>`);
      if(c.due)chips.push(`<span class="chip">Due <b>${fmtDate(c.due)}</b></span>`);
      if(c.teacher)chips.push(`<span class="chip"><b>${c.teacher}</b></span>`);
      if(c.priority==='high')chips.push(`<span class="chip" style="background:var(--crit-soft);color:var(--crit)"><b>High priority</b></span>`);
      p.innerHTML=chips.join('');};
    ci.addEventListener('input',prev);
    ci.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){doCapture(ci.value);}});
    ci.addEventListener('paste',e=>{const items=e.clipboardData?.items||[];for(const it of items){if(it.type.startsWith('image/')){const f=it.getAsFile();if(f){addFiles([f]);e.preventDefault();}}}});
    const cb=$('#capBtn');if(cb)cb.onclick=()=>doCapture(ci.value);
    const cf=$('#capFile');if(cf)cf.onclick=()=>$('#filePick').click();
  }
  document.querySelectorAll('[data-tile]').forEach(t=>t.onclick=()=>{const k=t.dataset.tile;taskFilter=k==='over'?'overdue':k==='week'?'week':k==='up'?'upcoming':'today';go('tasks');});
  document.querySelectorAll('[data-go]').forEach(g=>g.onclick=()=>{if(g.dataset.filt)taskFilter=g.dataset.filt;go(g.dataset.go);});
  document.querySelectorAll('[data-toggle]').forEach(c=>c.onclick=()=>toggleTask(c.dataset.toggle));
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.tasks=state.tasks.filter(t=>t.id!==b.dataset.del);save();render();toast('Deleted');});
  document.querySelectorAll('[data-task]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-toggle],[data-del]'))return;const t=state.tasks.find(x=>x.id===r.dataset.task);if(t)taskModal(t);});
  document.querySelectorAll('[data-filt]').forEach(f=>{if(f.classList.contains('filt'))f.onclick=()=>{taskFilter=f.dataset.filt;render();};});
  document.querySelectorAll('[data-ctab]').forEach(t=>t.onclick=()=>{corrTab=t.dataset.ctab;render();});
  document.querySelectorAll('[data-newcorr]').forEach(b=>b.onclick=()=>corrModal(b.dataset.newcorr));
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>markCorr(b.dataset.done));
  document.querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{const c=state.corrections.find(x=>x.id===b.dataset.reopen);if(c){c.submitted=null;save();render();}});
  document.querySelectorAll('[data-delcorr]').forEach(b=>b.onclick=()=>{state.corrections=state.corrections.filter(x=>x.id!==b.dataset.delcorr);save();render();toast('Deleted');});
  document.querySelectorAll('[data-deldoc]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.docs=state.docs.filter(d=>d.id!==b.dataset.deldoc);save();render();toast('Deleted');});
  const du=$('#docUpload');if(du)du.onclick=()=>$('#filePick').click();
  document.querySelectorAll('[data-newia]').forEach(b=>b.onclick=()=>iaModal());
  document.querySelectorAll('[data-ia]').forEach(r=>r.onclick=e=>{if(e.target.closest('[data-iareview],[data-iaup],[data-iadel]'))return;const i=state.ias.find(x=>x.id===r.dataset.ia);if(i)iaModal(i);});
  document.querySelectorAll('[data-iareview]').forEach(b=>b.onclick=e=>{e.stopPropagation();iaReviewModal(b.dataset.iareview);});
  document.querySelectorAll('[data-iaup]').forEach(b=>b.onclick=e=>{e.stopPropagation();iaUpload(b.dataset.iaup);});
  document.querySelectorAll('[data-iadel]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.ias=state.ias.filter(x=>x.id!==b.dataset.iadel);save();render();toast('Deleted');});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  // drop zone
  const dz=$('#dropZone');if(dz){dz.ondragover=e=>{e.preventDefault();dz.style.background='var(--surface-2)';};dz.ondragleave=()=>dz.style.background='';dz.ondrop=e=>{e.preventDefault();dz.style.background='';if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files);};}
}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;
  if(t.status!=='done'){t.status='done';t.doneAt=todayISO();
    if(t.recurring&&t.due){const d=new Date(t.due+'T00:00:00');d.setDate(d.getDate()+(t.recurring==='weekly'?7:30));
      state.tasks.push({...t,id:uid(),status:'open',doneAt:null,due:d.toISOString().slice(0,10),createdAt:Date.now()});}
  }else{t.status='open';}
  save();render();}
function markCorr(id){const c=state.corrections.find(x=>x.id===id);if(!c)return;c.submitted=todayISO();save();render();
  const s=corrState(c);toast(s.k==='late'?`Logged — ${s.label}`:'Logged — on time ✓');}

/* ============================ Global wiring ============================ */
document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.onclick=()=>{searchQ='';$('#globalSearch').value='';go(b.dataset.view);});
$('#newBtn').onclick=()=>{if(view==='corrections')corrModal(corrTab);else if(view==='ia')iaModal();else taskModal();};
$('#globalSearch').addEventListener('input',e=>{searchQ=e.target.value.trim();render();});
$('#filePick').addEventListener('change',e=>{if(e.target.files.length)addFiles(e.target.files);e.target.value='';});
$('#modalScrim').addEventListener('click',e=>{if(e.target.id==='modalScrim')closeModal();});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.act;
  if(a==='export')exportData();
  else if(a==='import')importData();
  else if(a==='sample'){state.tasks=[];state.corrections=[];state.docs=[];state.ias=[];seedData();render();toast('Fresh sample data loaded');closeMobileNav();}
  else if(a==='clear'){if(confirm('Clear ALL data? Export a backup first — this cannot be undone.')){state={tasks:[],corrections:[],docs:[],ias:[],settings:{teachers:[...DEFAULT_TEACHERS]},view:view};save();render();toast('All data cleared');}closeMobileNav();}
});
$('#menuToggle').onclick=()=>{$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('show');};
$('#scrim').onclick=closeMobileNav;
function closeMobileNav(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`coordinator-backup-${todayISO()}.json`;a.click();toast('Backup downloaded');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(!d.tasks)throw 0;state=d;if(!state.settings)state.settings={teachers:[...DEFAULT_TEACHERS]};save();render();toast('Backup restored');}catch(x){toast('That file could not be read');}};
    r.readAsDataURL?r.readAsText(f):r.readAsText(f);};
  inp.click();
}

/* ============================ Sample data ============================ */

/* ============================ Boot ============================ */
if(!state.tasks.length&&!state.corrections.length&&!state.docs.length)seedData();
view='dashboard';state.view='dashboard';
highlightNav();render();
</script>
